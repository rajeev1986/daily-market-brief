name: Keep Alive

# GitHub disables scheduled workflows on repos with no activity for 60 days.
# This workflow commits a tiny timestamp file every Sunday to keep the repo
# active and prevent the daily_rundown.yml schedule from being throttled.

on:
  schedule:
    - cron: "0 12 * * 0"   # Every Sunday at 12:00 UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  keepalive:
    name: Ping repo to prevent schedule throttling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Write keepalive timestamp
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" > .github/keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive $(date -u '+%Y-%m-%d')" || echo "No change"
          git push origin main || echo "Nothing to push"
